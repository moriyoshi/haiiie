[workspace]
resolver = "3"
members = [
    "haiiie-cli",
    "haiiie-core",
    "haiiie-embed",
    "haiiie-grpc",
    "haiiie-proto",
    "haiiie-peer",
    "haiiie-testkit",
]


[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moriyoshi/haiiie"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
